<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="text-center mb-4">
            <h1 class="display-5 text-primary">Task 2 - Todo App</h1>
        </div>

        <div class="row mb-4">
            <div class="col-md-6 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Search Todos</h5>
                        <div class="row">
                            <div class="col-8">
                                <input type="text" id="searchInput" class="form-control" placeholder="Search todos...">
                            </div>
                            <div class="col-4">
                                <select id="searchType" class="form-select">
                                    <option value="pending">Pending</option>
                                    <option value="completed">Completed</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Add New Todo</h5>
                        <form id="todoForm">
                            <div class="mb-2">
                                <input type="text" id="todoInput" class="form-control" placeholder="Enter your todo..." required>
                            </div>
                            <div class="row">
                                <div class="col-6">
                                    <select id="prioritySelect" class="form-select">
                                        <option value="low">Low</option>
                                        <option value="medium" selected>Medium</option>
                                        <option value="high">High</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <button type="submit" class="btn btn-primary w-100">Add</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0">
                            Pending Todos 
                            <span class="badge bg-dark" id="pendingCount">0</span>
                        </h5>
                    </div>
                    <div class="card-body" style="min-height: 400px;">
                        <div id="pendingTodos">
                            <div class="text-center text-muted p-4" id="pendingEmpty">
                                <p>No pending todos yet. Add one above</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">
                            Completed Todos 
                            <span class="badge bg-dark" id="completedCount">0</span>
                        </h5>
                    </div>
                    <div class="card-body" style="min-height: 400px;">
                        <div id="completedTodos">
                            <div class="text-center text-muted p-4" id="completedEmpty">
                                <p>No completed todos yet</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
